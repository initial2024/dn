name: Personal Device Lab CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify recovered files
        run: |
          test -s src/index.html
          test -s src/worker.mjs
          test -s src/embedded-html.mjs
# No automated deployment, credentials, DNS, or production mutations.
